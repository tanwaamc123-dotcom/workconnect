services:
  - type: web
    name: workconnect
    runtime: docker
    plan: starter
    healthCheckPath: /?page=health-ready
    preDeployCommand: php scripts/database-migrate.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Bangkok
      - key: APP_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: MAIL_TRANSPORT
        value: resend
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: BACKUP_OFFSITE_REQUIRED
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
  - type: cron
    name: workconnect-outbox
    runtime: docker
    plan: starter
    schedule: "*/2 * * * *"
    dockerCommand: php scripts/process-outbox.php 50
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MAIL_TRANSPORT
        value: resend
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
  - type: cron
    name: workconnect-reconciliation
    runtime: docker
    plan: starter
    schedule: "30 2 * * *"
    dockerCommand: php scripts/reconcile-finance.php
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
  - type: cron
    name: workconnect-backup
    runtime: docker
    plan: starter
    schedule: "15 2 * * *"
    dockerCommand: scripts/backup-db.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: BACKUP_OFFSITE_REQUIRED
        value: "1"
